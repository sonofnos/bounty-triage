name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  evaluate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[embeddings]"
      - run: python -m bounty_triage.evaluate --data data --out reports --embeddings
      - run: cat reports/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Example triage of a held-out report
        run: |
          python - <<'PY' > example-report.txt
          import gzip, json
          reports = [json.loads(l) for l in gzip.open("data/cve_reports.jsonl.gz", "rt")]
          latest = sorted(reports, key=lambda r: r["id"])[-1]
          print(latest["text"])
          PY
          python -m bounty_triage triage example-report.txt | tee reports/EXAMPLE.md
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
