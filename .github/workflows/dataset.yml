name: dataset

# Rebuild data/ from the current RustSec advisory-db and OSV, and commit it, so every
# evaluation after it runs on a fixed, versioned snapshot.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git clone --depth 1 https://github.com/rustsec/advisory-db advisory-db
      - run: python -m bounty_triage.fetch --advisory-db advisory-db --out data
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Dataset snapshot from rustsec/advisory-db@$(git -C advisory-db rev-parse --short HEAD)" || echo "no change"
          git push
